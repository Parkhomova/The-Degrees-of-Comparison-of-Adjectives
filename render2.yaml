services:
  - type: web
    name: english-comparative-2
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db-2
          property: connectionString

databases:
  - name: arena-db-2
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
