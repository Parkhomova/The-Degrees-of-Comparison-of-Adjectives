services:
  - type: web
    name: comparative-arena
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db
          property: connectionString

  - type: database
    name: arena-db
    databaseName: app_db
    plan: free
    region: frankfurt
    user: arena
    postgresMajorVersion: "16"
